name: Validate geographic prototype
on: [push, pull_request]
jobs:
  geography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/preprocess.py
      - run: python3 -m unittest discover -s tests -v
      - run: git diff --exit-code -- godot/data data/charminar.geojson
# Godot import/smoke and Android export must run with matching 4.7.2 templates,
# JDK17 and SDK configured. No paid runners or automatic publishing configured.
