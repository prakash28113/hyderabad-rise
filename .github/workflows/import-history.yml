name: Import approved Hyderabad Git history
on:
  push:
    branches: [dev/history-import]
    paths: [.github/workflows/import-history.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'prakash28113/hyderabad-rise'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import original development history
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash import-history.sh
